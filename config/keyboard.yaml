/**:
  ros__parameters:
    # 所有话题和服务使用相对名称，由 Compose 的 UAV_NAMESPACE 选择车辆。
    output_topic: control/manual
    state_topic: mavros/state
    arming_service: mavros/cmd/arming
    mode_service: mavros/set_mode

    speed: 0.5                    # 线速度，m/s
    turn: 1.0                     # 偏航角速度，rad/s
    publish_rate: 20.0             # 发布频率，Hz
    key_timeout: 0.6               # 按键重复停止后多久开始减速，s
    linear_acceleration: 1.0       # 线速度各轴的加/减速度限制，m/s²
    angular_acceleration: 2.0      # 偏航加/减速度限制，rad/s²
